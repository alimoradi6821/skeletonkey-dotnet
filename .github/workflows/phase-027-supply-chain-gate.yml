name: phase-027-supply-chain-gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-windows-supply-chain-gate:
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Verify SDK
        shell: pwsh
        run: dotnet --info

      - name: Clean-machine Phase 27 gate
        shell: pwsh
        run: ./build/verify-clean-machine-phase-027.ps1

      - name: Upload release and supply-chain records
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: skeletonkey-0.1.0-win-x64-phase-027
          path: |
            artifacts/release/skeletonkey-0.1.0-win-x64.zip
            artifacts/release/skeletonkey-0.1.0-win-x64.zip.sha256
            artifacts/release/skeletonkey-0.1.0-win-x64.sbom.cdx.json
            artifacts/release/skeletonkey-0.1.0-win-x64.provenance.json
            artifacts/release/skeletonkey-0.1.0-win-x64.signing-readiness.json
          if-no-files-found: error
          retention-days: 14
