name: Continuous Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.302"

      - name: Restore
        shell: pwsh
        run: dotnet restore SkeletonKey.sln

      - name: Build
        shell: pwsh
        run: dotnet build SkeletonKey.sln -c Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test SkeletonKey.sln -c Release --no-build --no-restore

      - name: Standalone export smoke
        shell: pwsh
        run: ./build/verify-standalone-export.ps1
