name: phase-026-production-gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-windows-production-gate:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Verify SDK
        shell: pwsh
        run: dotnet --info

      - name: Clean-machine production gate
        shell: pwsh
        run: ./build/verify-clean-machine.ps1

      - name: Upload release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: skeletonkey-0.1.0-win-x64-phase-026
          path: |
            artifacts/release/skeletonkey-0.1.0-win-x64.zip
            artifacts/release/skeletonkey-0.1.0-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
