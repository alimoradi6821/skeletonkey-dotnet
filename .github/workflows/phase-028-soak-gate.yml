name: phase-028-soak-gate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  clean-windows-soak-gate:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Verify SDK
        shell: pwsh
        run: dotnet --info

      - name: Clean-machine Phase 28 soak gate
        shell: pwsh
        run: ./build/verify-clean-machine-phase-028.ps1 -CoreIterations 150 -BrowserIterations 20 -MinimumSoakMinutes 10

      - name: Upload Phase 28 soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skeletonkey-0.1.0-win-x64-phase-028-soak
          path: |
            artifacts/soak/phase-028-clean-machine-soak-report.json
            artifacts/release/skeletonkey-0.1.0-win-x64.zip
            artifacts/release/skeletonkey-0.1.0-win-x64.zip.sha256
            artifacts/release/skeletonkey-0.1.0-win-x64.sbom.cdx.json
            artifacts/release/skeletonkey-0.1.0-win-x64.provenance.json
            artifacts/release/skeletonkey-0.1.0-win-x64.signing-readiness.json
          if-no-files-found: warn
          retention-days: 14
